name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # cancel superseded PR runs, never an in-progress deploy on main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the test report comment
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Sync hook tests
        run: bash test/hook/run.sh
      - name: Script tests
        run: bash test/scripts/run.sh
      - name: Publish the Vitest UI report
        id: ui
        # public URL with the test code; accepted risk while the repo is private (it will be public)
        if: always() && github.event_name == 'pull_request' && hashFiles('reports/html/index.html') != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          out=$(npx wrangler versions upload -c reports.wrangler.jsonc --preview-alias "pr-${{ github.event.pull_request.number }}" 2>&1)
          echo "url=https://pr-${{ github.event.pull_request.number }}-second-brain-mcp-tests.$(node scripts/config.mjs subdomain).workers.dev" >> "$GITHUB_OUTPUT"
          # each upload also gets its own URL, so every commit keeps its report (red ones included)
          echo "version_url=$(printf '%s\n' "$out" | grep -o 'Version Preview URL: https://[^ ]*' | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Post the test report on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('reports/tests.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          UI_URL: ${{ steps.ui.outputs.url }}
          UI_VERSION_URL: ${{ steps.ui.outputs.version_url }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- test-report -->")) | .id' | tail -1)
          if [ -n "$id" ]; then gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body > previous.md; else : > previous.md; fi
          PREVIOUS=previous.md node scripts/test-report.mjs reports/tests.json > report.md
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@report.md >/dev/null; else gh pr comment "$PR" --body-file report.md; fi

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the deploy token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: '[ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret to deploy."; exit 1; }'
      - run: npx wrangler d1 migrations apply second-brain --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
